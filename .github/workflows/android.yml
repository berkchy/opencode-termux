name: android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "anomalyco/opencode ref to build (branch, tag or commit)"
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: anomalyco/opencode
  # Pinned upstream commit; bump this to ship a newer opencode.
  UPSTREAM_REF: 83960f8a56b2f2b8ad0b751f23baaf9d0eb65ad9

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out opencode
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_ref || env.UPSTREAM_REF }}
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun dependencies
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: linux-bun-1.4.4-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: linux-bun-1.4.4-

      - name: Cache Bun compile runtime
        id: bun-compile-cache
        uses: actions/cache@v4
        with:
          path: packages/cli/dist/.bun
          key: bun-compile-bun-v1.4.4-${{ runner.arch }}
          restore-keys: bun-compile-bun-v1.4.4-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: packages/cli
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.4
          OPENCODE_TARGET: linux-arm64-musl
          OPENCODE_CHANNEL: dev
          GH_TOKEN: ${{ github.token }}
        run: bun run build

      - name: Bundle musl runtime into package
        run: |
          mkdir -p pkg/opencode-termux/lib
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w alpine:latest sh -euxc '
            apk add --root /w/pkg-root --initdb --arch aarch64 --no-cache --no-scripts --repository https://dl-cdn.alpinelinux.org/alpine/latest-stable/main musl libstdc++ libgcc
            cp -L /w/pkg-root/lib/ld-musl-aarch64.so.1 pkg/opencode-termux/lib/ld-musl-aarch64.so.1
            cp -L /w/pkg-root/lib/libc.musl-aarch64.so.1 pkg/opencode-termux/lib/libc.musl-aarch64.so.1
            cp -L /w/pkg-root/usr/lib/libstdc++.so.6 pkg/opencode-termux/lib/libstdc++.so.6
            cp -L /w/pkg-root/usr/lib/libgcc_s.so.1 pkg/opencode-termux/lib/libgcc_s.so.1
          '
          cp packages/cli/dist/cli-linux-arm64-musl/bin/opencode pkg/opencode-termux/opencode.bin
          cp packages/cli/dist/cli-linux-arm64-musl/package.json pkg/opencode-termux/package.json
          git -C . rev-parse HEAD > pkg/opencode-termux/UPSTREAM_COMMIT
          printf '%s\n' \
            '#!/bin/sh' \
            'src="$0"' \
            'while [ -L "$src" ]; do' \
            '  dir=$(CDPATH= cd -- "$(dirname -- "$src")" && pwd)' \
            '  target=$(readlink -- "$src")' \
            '  case "$target" in' \
            '    /*) src="$target" ;;' \
            '    *) src="$dir/$target" ;;' \
            '  esac' \
            'done' \
            'DIR=$(CDPATH= cd -- "$(dirname -- "$src")" && pwd)' \
            'exec "$DIR/lib/ld-musl-aarch64.so.1" --library-path "$DIR/lib" "$DIR/opencode.bin" "$@"' \
            > pkg/opencode-termux/opencode
          chmod 755 pkg/opencode-termux/opencode pkg/opencode-termux/opencode.bin
          chmod 755 pkg/opencode-termux/lib/*
          tar -czf opencode-termux-arm64.tar.gz -C pkg opencode-termux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-termux-arm64
          path: opencode-termux-arm64.tar.gz
          retention-days: 90
